name: Archive Phases (Notion)

on:
  schedule:
    # Tous les lundis a 02:00 UTC (04:00 Europe/Paris en ete, 03:00 en hiver).
    # A ajuster manuellement au changement d'heure si besoin.
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Archive phases terminees
        run: npx tsx scripts/archive-phases.ts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
