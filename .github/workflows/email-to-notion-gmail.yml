name: Email to Notion (Gmail)

on:
  schedule:
    # 20:00 UTC -> 22:00 Europe/Paris en ete (CEST), 21:00 en hiver (CET).
    # A ajuster manuellement au changement d'heure si besoin.
    - cron: "0 20 * * *"
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Import Gmail -> Notion
        run: npx tsx email-to-notion-input-gmail.ts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
