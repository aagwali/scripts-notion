name: Sync Tasks -> Google Calendar (Notion)

on:
  schedule:
    # 00:00 UTC -> 02:00 Europe/Paris en ete (CEST), 01:00 en hiver (CET).
    # L'heure exacte est sans consequence : le script retient les taches
    # modifiees dans les 30 dernieres heures, fenetre large devant les 24h
    # entre deux runs. Un run manque ou retarde est rattrape par le suivant.
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Sync Tasks -> Google Calendar
        run: npx tsx scripts/sync-tasks-calendar.ts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
