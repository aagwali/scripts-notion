name: Sync Tasks -> Google Calendar (Notion)

on:
  schedule:
    # 05:00 UTC -> 07:00 Europe/Paris en ete (CEST), 06:00 en hiver (CET).
    # Deux heures apres la tache planifiee d'ingestion (03:00 UTC), qui pose
    # Deadline et Reminder sur les Tasks : ses dates partent dans l'agenda le
    # matin meme. La fenetre de 30h rattrape un run manque ou retarde.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Sync Tasks -> Google Calendar
        run: npx tsx scripts/sync-tasks-calendar.ts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
