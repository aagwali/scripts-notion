name: Clean Docs (Notion)

on:
  schedule:
    # Tous les dimanches a 03:00 UTC (05:00 Europe/Paris en ete, 04:00 en
    # hiver). A ajuster manuellement au changement d'heure si besoin.
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation : aucune corbeille, aucun email"
        type: boolean
        default: false

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Nettoyage des Docs relus
        run: npx tsx scripts/clean-docs.ts ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
