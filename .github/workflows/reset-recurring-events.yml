name: Reset Recurring Events (Notion)

on:
  schedule:
    # Minuit UTC, donc 1h ou 2h a Paris selon l'heure d'ete/hiver : sans
    # enjeu, seul le jour calendaire compte pour ce script.
    - cron: "0 0 * * *"
  workflow_dispatch: {}

# Le declenchement planifie et un lancement manuel peuvent se chevaucher :
# la rejouabilite du script repose sur une lecture puis une ecriture de Date,
# que deux runs simultanes pourraient enjamber.
concurrency:
  group: reset-recurring-events
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Reset des evenements recurrents
        run: npx tsx scripts/reset-recurring-events.ts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
